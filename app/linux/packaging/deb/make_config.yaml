display_name: Relay
package_name: relay
maintainer:
  name: Aritra Saha
  email: aritrasab@gmail.com
priority: optional
section: x11
installed_size: 30600
essential: false
icon: assets/img/relay-icon-linux-512.png

pre_dependencies:
  - libc6 (>= 2.31)

dependencies:
  - libappindicator3-1 | libayatana-appindicator3-1
  - gir1.2-appindicator3-0.1 | gir1.2-ayatanaappindicator3-0.1
  - libayatana-ido3-0.4-0
  - xdg-user-dirs

postinstall_scripts:
  # GNOME matches a running window to its launcher by the GTK application id
  # (the X11 WM_CLASS / Wayland app_id), which is com.foresight.app.relay and
  # cannot change without relocating the user's settings directory. A desktop
  # entry is only found by that route when its own file name is the
  # application id, so the entry generated from the package name is republished
  # under the id and the original is kept as a hidden alias. Without this the
  # shell has no entry to resolve and falls back to showing the raw id string
  # and a generic icon instead of "Relay".
  - 'DESKTOP_ENTRY=/usr/share/applications/relay.desktop'
  - 'APP_ID_ENTRY=/usr/share/applications/com.foresight.app.relay.desktop'
  - 'if [ -f "$DESKTOP_ENTRY" ] && ! grep -q "^StartupWMClass=" "$DESKTOP_ENTRY"; then echo "StartupWMClass=com.foresight.app.relay" >> "$DESKTOP_ENTRY"; fi'
  # The icon has to be resolvable as "com.foresight.app.relay" in the hicolor
  # theme, so every size the package installed under the package name is
  # published under the application id as well.
  - 'for icon in /usr/share/icons/hicolor/*/apps/relay.png /usr/share/icons/hicolor/*/apps/relay.svg; do [ -f "$icon" ] || continue; dir=$(dirname "$icon"); ext=${icon##*.}; cp -f "$icon" "$dir/com.foresight.app.relay.$ext"; done'
  - 'if [ -f "$DESKTOP_ENTRY" ]; then sed -e "s/^Icon=.*/Icon=com.foresight.app.relay/" -e "s/^Name=.*/Name=Relay/" -e "/^NoDisplay=/d" "$DESKTOP_ENTRY" > "$APP_ID_ENTRY"; fi'
  - 'if [ -f "$APP_ID_ENTRY" ] && ! grep -q "^NoDisplay=" "$DESKTOP_ENTRY"; then echo "NoDisplay=true" >> "$DESKTOP_ENTRY"; fi'
  - 'command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true'
  - 'command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true'
postuninstall_scripts:
  - 'rm -f /usr/share/applications/com.foresight.app.relay.desktop'
  - 'rm -f /usr/share/icons/hicolor/*/apps/com.foresight.app.relay.png /usr/share/icons/hicolor/*/apps/com.foresight.app.relay.svg'
  - 'command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || true'
  - 'command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true'

keywords:
  - Sharing
  - LAN
  - Files

generic_name: Share files securely across your devices

categories:
  - GTK
  - FileTransfer
  - Utility

startup_notify: true
