<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Relay Android launcher preview">
  <!-- Android launcher preview: adaptive background + foreground composited under a squircle mask. -->
  <defs>
    <linearGradient id="plate" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2620"/>
      <stop offset="0.52" stop-color="#1D1A16"/>
      <stop offset="1" stop-color="#12100E"/>
    </linearGradient>
    <radialGradient id="sheen" cx="256" cy="52" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="256" y1="0" x2="256" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="relayGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F07855"/>
      <stop offset="0.55" stop-color="#E08A52"/>
      <stop offset="1" stop-color="#C89A55"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="114"/>
    </clipPath>
    <symbol id="mark" viewBox="0 0 128 128">
      <g fill="none" stroke="url(#relayGrad)" stroke-width="11">
        <rect x="16" y="16" width="30" height="30" rx="10"/>
        <rect x="82" y="82" width="30" height="30" rx="10"/>
      </g>
      <rect x="53" y="53" width="22" height="22" rx="6" transform="rotate(45 64 64)" fill="url(#relayGrad)"/>
    </symbol>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#plate)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <!-- foreground layer: 108 dp grid scaled to 512, mark 66 dp inside the 72 dp safe circle -->
    <use href="#mark" x="99.6" y="99.6" width="312.9" height="312.9"/>
  </g>
  <rect x="1.25" y="1.25" width="509.5" height="509.5" rx="113" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
</svg>
