[package]
name = "rust_lib_relay_app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# `mpris` must be declared *here* as well as in relay_core: a `#[cfg(feature =
# "mpris")]` inside this crate is evaluated against this crate's features, so
# without this the MPRIS start-up call is silently compiled out of the app even
# though relay_core has the feature on. Forwarded, and on by default.
[features]
default = ["mpris"]
mpris = ["relay_core/mpris"]

[dependencies]
anyhow = "1.0"
bytes = "1.12"
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }
relay_core = { path = "../../core", features = ["full", "anywhere"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22" }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
