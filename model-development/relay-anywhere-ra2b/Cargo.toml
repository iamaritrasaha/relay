[package]
name = "relay-anywhere-ra2b"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "relay_anywhere_ra2b"
path = "src/lib.rs"

[[bin]]
name = "relay-anywhere-ra2b"
path = "src/main.rs"
required-features = ["linux-harness"]

[dependencies]
anyhow = "1.0"
base64 = "0.23"
hex = "0.4"
iroh = { version = "=1.0.3", features = ["metrics", "tls-ring"] }
localsend = { path = "../../packages/core", features = ["full", "anywhere"] }
rand = "0.9"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.iroh-relay]
version = "=1.0.3"
features = ["server", "test-utils"]
optional = true

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[features]
default = []
linux-harness = ["dep:clap", "dep:iroh-relay", "iroh/test-utils"]

[lints.rust]
unsafe_code = "forbid"
