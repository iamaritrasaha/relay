[package]
name = "relay-anywhere-ra2a"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
hex = "0.4"
iroh = { version = "=1.0.3", features = ["test-utils"] }
iroh-relay = { version = "=1.0.3", features = ["server", "test-utils"] }
relay_core = { path = "../../packages/core", features = ["full"] }
rand = "0.9"
rcgen = { version = "0.14", features = ["crypto", "ring"] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
